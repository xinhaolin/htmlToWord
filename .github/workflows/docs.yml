name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify generated pages and local links
        run: python3 scripts/build-docs.py --check
